schema_version: "1.0.0"
schema_id: "psi-gap-detection-prompts"
status: "operational"
description: >-
  Diagnostic interrogation prompts used by the AI during the initial Framing and PSI Gate
  steps to detect missing, stale, or contradictory Process Safety Information (PSI).
authority_basis:
  - "OSHA 29 CFR 1910.119(d) Process Safety Information"
  - "CCPS Risk-Based Process Safety: Process Knowledge Management"
created_date: "2026-08-15"
update_owner: "Process Safety Lead / SSHE Specialist"
review_frequency: "Annual + after any incident involving inadequate process information"

diagnostic_prompts:
  - pillar: "Pillar 1 — Hazards of Process Materials"
    prompts:
      - prompt_id: "PSI-PROMPT-1A"
        question: "Is the complete chemical composition of the stream confirmed, including trace toxic or corrosive constituents (e.g., H2S, Benzene, HF, Mercury, organic peroxides, amine degradation products)?"
        gap_if_missing: "EVIDENCE_GAP — CRITICAL (Chemical Identity Unknown)"
        action_if_missing: "Issue SES-01; request current laboratory stream analysis or specific product SDS; route to Process/Chemical Engineer."
      - prompt_id: "PSI-PROMPT-1B"
        question: "What is the operating temperature relative to the flash point and auto-ignition temperature of every liquid constituent present?"
        gap_if_missing: "EVIDENCE_GAP — MATERIAL (Thermal/Flammability Exposure Unknown)"
        action_if_missing: "Require flash point data from SDS Section 9; challenge ignition controls if T_operating > T_flash."
      - prompt_id: "PSI-PROMPT-1C"
        question: "Are chemical reactivity and compatibility verified for all cleaning, flushing, purging, or decontaminating agents introduced during the task?"
        gap_if_missing: "EVIDENCE_GAP — CRITICAL (Reactivity Incompatibility)"
        action_if_missing: "Issue SES-01; request Chemical Compatibility Matrix and Chemical Engineer approval before introducing flushing media."

  - pillar: "Pillar 2 — Technology of the Process"
    prompts:
      - prompt_id: "PSI-PROMPT-2A"
        question: "What are the approved Safe Operating Limits (SOL) for pressure, temperature, liquid level, and flow rate for the isolated equipment and adjacent running units?"
        gap_if_missing: "EVIDENCE_GAP — MATERIAL (Operating Envelope Undefined)"
        action_if_missing: "Request Safe Operating Limit sheets and DCS alarm setpoint summaries from Operations Supervisor."
      - prompt_id: "PSI-PROMPT-2B"
        question: "Are there any active or open Management of Change (MOC) items, temporary operating procedures, or pending PSSRs affecting the work boundary?"
        gap_if_missing: "EVIDENCE_GAP — HIGH (Potential Unrecorded Configuration Change)"
        action_if_missing: "Request MOC register extract for the operating unit from the last 12 months."
      - prompt_id: "PSI-PROMPT-2C"
        question: "Has the consequence of process deviations (e.g., cooling loss, overfilling, thermal expansion) during task execution been evaluated in the unit PHA/HAZOP?"
        gap_if_missing: "EVIDENCE_GAP — MATERIAL (PHA Scenario Unchecked)"
        action_if_missing: "Cross-reference PHA recommendation register for the affected node."

  - pillar: "Pillar 3 — Equipment in the Process"
    prompts:
      - prompt_id: "PSI-PROMPT-3A"
        question: "What is the drawing number and approved revision of the P&ID for this system, and has it been walked down in the field to verify as-built status?"
        gap_if_missing: "EVIDENCE_GAP — CRITICAL (P&ID Unverified)"
        action_if_missing: "Issue SES-01/SES-02; prohibit line breaking based on unverified or redline P&ID without field walkdown."
      - prompt_id: "PSI-PROMPT-3B"
        question: "Are all Pressure Safety Valves (PSVs), rupture discs, vents, and drain lines routed to a verified safe discharge destination (flare header, scrubbed vent, closed oily sewer)?"
        gap_if_missing: "EVIDENCE_GAP — CRITICAL (Relief Pathway Unconfirmed)"
        action_if_missing: "Issue SES-04 if relief is blocked; request relief system P&ID and Car-Seal register."
      - prompt_id: "PSI-PROMPT-3C"
        question: "Are any Safety Instrumented Systems (SIS), interlocks, ESD trips, or flammable/toxic gas detectors currently bypassed, inhibited, or in manual override?"
        gap_if_missing: "EVIDENCE_GAP — CRITICAL (Defeated Safeguard Status Unknown)"
        action_if_missing: "Issue SES-05; request unit Bypass/Inhibit Register and authorized MOC compensating measures."
      - prompt_id: "PSI-PROMPT-3D"
        question: "What is the Hazardous Area Classification (Zone 0/1/2 or Class I Div 1/2) at the work location, and do all electrical and hot work tools meet the certified Ex-rating?"
        gap_if_missing: "EVIDENCE_GAP — HIGH (Ex-Rating Unconfirmed)"
        action_if_missing: "Request Hazardous Area Classification Drawing and ATEX/IECEx tool certification records."
      - prompt_id: "PSI-PROMPT-3E"
        question: "What is the mechanical integrity condition, last ultrasonic thickness (UT) inspection date, and remaining corrosion allowance for the equipment in scope?"
        gap_if_missing: "EVIDENCE_GAP — MATERIAL (Equipment Integrity Unknown)"
        action_if_missing: "Request inspection database record and fitness-for-service evaluation if thickness survey is overdue."
