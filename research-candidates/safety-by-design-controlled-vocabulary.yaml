schema_version: "1.0.0"
candidate_id: "safety-by-design-controlled-vocabulary"
status: "DRAFT_NOT_LOADED"
runtime_loaded: false
owner_review_required: ["Process Safety", "Process Engineering", "Human Factors", "JSEA Governance"]
source_claims: ["SBD-CLM-004", "SBD-CLM-005", "SBD-CLM-006", "SBD-CLM-007", "SBD-CLM-008", "SBD-CLM-010", "SBD-CLM-011", "SBD-CLM-012", "SBD-CLM-018"]
design_rules:
  - "Use evidence-qualified descriptions instead of AI declarations of safety."
  - "Keep physical state, observed state and assessment state distinct."
  - "Keep knowledge kind and evidence state as independent axes."
  - "Retain site terminology through an explicit mapping; do not silently redefine it."
  - "Dynamic language is qualitative unless approved evidence supplies numbers."
  - "Human-system fields describe observable conditions, not personal traits or scores."

axes:
  knowledge_kind:
    purpose: "Describe what kind of proposition is being made."
    values:
      - value: "invariant_principle"
        definition: "A conservation, thermodynamic, transport or chemical principle that does not depend on local policy."
      - value: "engineering_model"
        definition: "A model whose use depends on assumptions, parameters, validation and an applicability domain."
      - value: "empirical_data"
        definition: "Measured, tested or observed information with provenance and uncertainty."
      - value: "contextual_engineering"
        definition: "Site, equipment, process, procedure or design information that is valid only in its stated context."
      - value: "human_organizational"
        definition: "Observable task, interface, staffing, communication or organizational conditions."
      - value: "governance"
        definition: "Authority, legal applicability, acceptance, change control or approval requirements."
  evidence_state:
    purpose: "Reuse the existing Unified Evidence Labels without creating a second evidence taxonomy."
    values: ["FACT", "REFERENCE", "AI_HYPOTHESIS", "EVIDENCE_GAP", "HUMAN_ONLY_DECISION"]
  causal_support_state:
    purpose: "Describe support for a mechanism or candidate causal path, not overall safety or risk."
    values: ["SUPPORTED_BY_FACT", "PLAUSIBLE_UNVERIFIED", "CONTRADICTED", "NOT_APPLICABLE", "INSUFFICIENT_EVIDENCE", "SPECIALIST_CALCULATION_REQUIRED"]

candidate_terms:
  - term: "TypedCausalGraph"
    definition: "A branchable, loop-capable representation of sources, states, transitions, safeguards, dependencies, targets and evidence."
    permitted_ai_use: "Build and challenge qualitative causal hypotheses."
    prohibited_interpretation: "A complete process model or proof that every credible scenario has been found."
  - term: "SystemStateSnapshot"
    definition: "A time- and mode-bounded description of the process, equipment, topology, safeguard, control, environment and human-system conditions asserted to exist."
    permitted_ai_use: "Organize supplied facts and identify missing state variables."
    prohibited_interpretation: "A declaration that the plant is safe or that an observed indicator equals reality."
  - term: "ObservedState"
    definition: "What instruments, records, tests or people report about a system at a stated time."
    permitted_ai_use: "Attach provenance, age and conflicts to observations."
    prohibited_interpretation: "The actual state merely because the observation is digital or recent."
  - term: "AssessmentState"
    definition: "What current evidence supports, contradicts or leaves unresolved about a named proposition."
    permitted_ai_use: "Classify evidence sufficiency and trigger retrieval, verification or escalation."
    prohibited_interpretation: "A physical component of the plant or a substitute for competent interpretation."
  - term: "ModeSpecificConstraintEnvelope"
    definition: "An internal container for approved mode-specific constraints and their provenance."
    permitted_ai_use: "Compare known state assertions with imported, site-owned constraints."
    prohibited_interpretation: "A JSEA-generated safe operating envelope, alarm limit, trip limit or operating authority."
  - term: "DynamicConcern"
    definition: "A qualitative concern involving direction, rate, accumulation, sequence, delay, feedback or a transient configuration."
    permitted_ai_use: "Name variables and evidence required to assess the trajectory."
    prohibited_interpretation: "A calculated trajectory, time-to-harm or loss-of-recoverability boundary."
  - term: "HiddenStateHypothesis"
    definition: "A safety-relevant condition not established or excluded by currently available observations."
    permitted_ai_use: "Preserve a bounded hypothesis and identify discriminating evidence."
    prohibited_interpretation: "Treat the hidden condition as fact or choose a worst-case numerical value."
  - term: "SafeguardFunction"
    definition: "A measure intended to prevent, detect, interrupt, mitigate or support recovery on a named causal edge."
    permitted_ai_use: "Test causal relevance, state, timing, dependencies and evidence."
    prohibited_interpretation: "Automatic IPL credit, reliability, SIL, PFD or adequacy."
  - term: "SafeguardDependency"
    definition: "A resource, signal, logic path, human action, utility, environment or organizational condition required for a safeguard function."
    permitted_ai_use: "Identify common cause, shared resource and unresolved independence concerns."
    prohibited_interpretation: "A numerical dependency factor or proof of independence."
  - term: "ProtectionOrMarginDegraded"
    definition: "Evidence indicates that named protection, integrity, observability or margin is reduced for specified scenarios."
    permitted_ai_use: "Describe the affected function and route disposition to site governance."
    prohibited_interpretation: "A decision that continued operation is acceptable or prohibited."
  - term: "DeclaredConstraintsSupported"
    definition: "Current evidence supports the named, imported constraints for the examined mode and scope."
    permitted_ai_use: "Report bounded evidence status with unresolved items."
    prohibited_interpretation: "Nominal safe, absolutely safe, approved to operate or complete hazard coverage."
  - term: "ConstraintViolationRecoveryUnverified"
    definition: "A named constraint appears violated and a feasible recovery path has not been established by evidence."
    permitted_ai_use: "Raise a hold point and identify missing recovery evidence."
    prohibited_interpretation: "Predict harm timing, prescribe emergency manipulation or authorize response."
  - term: "StableConditionSupportedForNamedHazard"
    definition: "Engineering evidence supports stability for a named hazard and stated period or conditions."
    permitted_ai_use: "Restate approved evidence and its scope."
    prohibited_interpretation: "Stable safe for all hazards or indefinitely."
  - term: "LossOfRecoverabilitySupportedByEngineeringEvidence"
    definition: "Approved analysis identifies a point beyond which named recovery functions cannot meet the required outcome."
    permitted_ai_use: "Retrieve and communicate an existing engineering conclusion."
    prohibited_interpretation: "An AI-invented tipping point or time boundary."
  - term: "HoldPoint"
    definition: "An unresolved, safety-significant condition that prevents analytical closure or decision readiness."
    permitted_ai_use: "Raise and explain the hold point."
    prohibited_interpretation: "AI closure, permit approval, risk acceptance or emergency command authority."

collision_map:
  - research_term: "System Safety State including EvidenceState"
    collision: "Conflates plant reality with what evidence supports."
    controlled_use: "Use SystemStateSnapshot plus separate AssessmentState."
  - research_term: "Safe Operating Envelope"
    collision: "May conflict with site safe limits, operating windows, alarm/trip limits or API IOW terminology."
    controlled_use: "Use ModeSpecificConstraintEnvelope internally until an explicit site mapping is approved."
  - research_term: "nominal_safe"
    collision: "Sounds like AI safety approval."
    controlled_use: "Use DeclaredConstraintsSupported with named scope and evidence."
  - research_term: "safe_degraded"
    collision: "Can imply that degraded operation has been accepted."
    controlled_use: "Use ProtectionOrMarginDegraded and route disposition to the competent site role."
  - research_term: "unsafe_recoverable"
    collision: "Can imply recovery is established and operational action is authorized."
    controlled_use: "Use ConstraintViolationRecoveryUnverified unless approved engineering evidence establishes recovery."
  - research_term: "stable_safe"
    collision: "Overgeneralizes stability and safety."
    controlled_use: "Use StableConditionSupportedForNamedHazard."
  - research_term: "committed_irreversible"
    collision: "Can become rhetorical or AI-invented."
    controlled_use: "Use LossOfRecoverabilitySupportedByEngineeringEvidence only when traceable analysis exists."
  - research_term: "confidence score"
    collision: "May be confused with probability, reliability or residual risk."
    controlled_use: "Use evidence state plus rationale; never convert model confidence to risk acceptance."

promotion_gate:
  required:
    - "Domain owners approve definitions and site-language collision handling."
    - "Candidate evals demonstrate no safe-label or authorization leakage."
    - "Existing evidence labels remain authoritative."
    - "A migration ADR identifies any runtime field or output change."

