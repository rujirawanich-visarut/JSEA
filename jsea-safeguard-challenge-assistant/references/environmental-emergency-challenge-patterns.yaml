schema_version: "1.0.0"
schema_id: "environmental-emergency-challenge-patterns"
status: "operational"
description: >-
  Challenge patterns for environmental emergency controls and safeguard adequacy
  during Loss of Primary Containment (LOPC), large chemical releases, spill containment,
  firewater runoff, and environmental receptor protection.
authority_basis:
  - "ISO 14001:2026 Environmental Management Systems"
  - "Thailand Factory Act B.E. 2535 — Pollution and Waste Management"
  - "Thailand Hazardous Substance Act B.E. 2535"
  - "IEAT Notification No. 34/2564 PSM Guidelines"
  - "NFPA 30 / EPA Spill Prevention, Control, and Countermeasure (SPCC)"
created_date: "2026-08-15"
update_owner: "Environmental Specialist / Process Safety Lead"
review_frequency: "Annual + after any spill, LOPC incident, or MOC affecting drainage"

challenge_patterns:
  - pattern_id: "ENV-EM-01"
    name: "Secondary Containment & Bund/Dyke Capacity Adequacy"
    hazard_mechanism: "Catastrophic vessel/tank rupture, bulk transfer hose failure, or overfilling leading to liquid release exceeding containment capacity."
    common_flawed_safeguard: "Relying on existing concrete bund or curbing without verifying available net volume relative to stored inventory."
    challenge_questions:
      - "What is the maximum credible release volume (largest single tank inventory + 10-25 year 24h storm water allowance)?"
      - "Has the net bund volume been verified after subtracting the displacement volume of other tanks and equipment inside the bund?"
      - "Are bund walls, penetrations, expansion joints, and sealants chemically compatible with the stored substance?"
      - "Is the bund drain valve verified in the LOCKED CLOSED position (Car-Seal-Closed) before starting transfer/maintenance?"
    prohibited_ai_assumptions:
      - "Assuming any bund is adequately sized without net volume calculation."
      - "Assuming bund walls are liquid-tight without inspection verification."
    required_evidence:
      - "Bund volume sizing calculation and civil inspection record."
      - "Drain valve Car-Seal-Closed (CS-C) verification log."
    required_field_verification:
      - "Physical walkdown of bund walls, sump, and closed isolation valve."
    specialist_role: "Environmental Officer / Civil Engineer"
    escalation_level: "LEVEL_2_SPECIALIST_REVIEW"

  - pattern_id: "ENV-EM-02"
    name: "Drainage Pathway & Storm Water vs. Chemical Sewer Isolation"
    hazard_mechanism: "Chemical spill or contaminated wash water entering storm water drains that route directly to public watercourses or off-site canals."
    common_flawed_safeguard: "'Drains are present in the area' or 'Wash water will be flushed into local drainage.'"
    challenge_questions:
      - "Where does the storm water drain at this work location route (internal retention pond, chemical treatment plant, or off-site canal)?"
      - "Are storm water drop inlets and catch basins within the potential spill radius physically covered or blanked with drain covers/inflatable plugs?"
      - "Is the area storm water isolation valve closed and verified prior to line opening or hazardous substance handling?"
      - "Does the facility possess a licensed industrial wastewater treatment system capable of treating this specific chemical stream?"
    prohibited_ai_assumptions:
      - "Assuming storm drains connect to a wastewater treatment plant."
      - "Accepting open pavement or storm drain discharge for water-soluble chemicals."
    required_evidence:
      - "Plant drainage destination map (P&ID / Civil layout)."
      - "Storm drain isolation record or inflatable drain plug deployment log."
    required_field_verification:
      - "Field inspection of drain covers and verification of perimeter discharge gate position."
    specialist_role: "Environmental Officer / Operations Supervisor"
    escalation_level: "LEVEL_2_SPECIALIST_REVIEW"

  - pattern_id: "ENV-EM-03"
    name: "Contaminated Firewater Runoff Containment"
    hazard_mechanism: "Fire suppression operations generate massive volumes of water mixed with toxic chemicals, foam concentrates (AFFF/PFAS), and combustion products, overwhelming local drainage."
    common_flawed_safeguard: "Assuming firewater will naturally evaporate or be contained by standard operational sewers."
    challenge_questions:
      - "What is the estimated firewater application rate and total volume for the design fire scenario (typically 2-4 hours duration)?"
      - "Does the facility have dedicated firewater retention basin capacity to hold combined firewater + maximum chemical inventory + rainwater?"
      - "What valves must be actuated to divert firewater runoff away from public discharge points into retention ponds?"
      - "Is there a post-fire water analysis and disposal protocol before any release to the environment?"
    prohibited_ai_assumptions:
      - "Assuming standard operational drainage can handle emergency firewater flow."
      - "Assuming firefighting foam runoff is non-hazardous and dischargeable without treatment."
    required_evidence:
      - "Firewater containment calculation & emergency runoff diversion procedure."
      - "Environmental Emergency Response Plan (EERP) firewater section."
    required_field_verification:
      - "Verification of firewater diversion gate operational readiness."
    specialist_role: "Emergency Response Coordinator / Environmental Officer / Fire Chief"
    escalation_level: "LEVEL_2_SPECIALIST_REVIEW"

  - pattern_id: "ENV-EM-04"
    name: "Vapor Cloud Dispersion & Off-Site Sensitive Receptor Protection"
    hazard_mechanism: "Atmospheric release of toxic gas, volatile organic compounds (VOCs), or dense gas dispersing across plant fence-line toward surrounding communities, schools, or hospitals."
    common_flawed_safeguard: "Relying solely on on-site personal gas monitors or general plant boundary odor complaints."
    challenge_questions:
      - "What is the toxic endpoint concentration (e.g., ERPG-2, AEGL-2, IDLH) and calculated dispersion distance under adverse meteorological conditions?"
      - "Where are the nearest off-site sensitive receptors (communities, schools, hospitals, water reservoirs) relative to prevailing wind direction?"
      - "Are fixed perimeter toxic gas detectors operational, calibrated, and linked to automatic alarm telemetry?"
      - "What are the regulatory notification thresholds (Thailand DIW / IEAT emergency reporting within 1-3 hours)?"
    prohibited_ai_assumptions:
      - "Assuming release will disperse safely without consequence analysis."
      - "Assuming off-site impact is impossible without atmospheric dispersion data."
    required_evidence:
      - "PHA / Consequence dispersion modeling report for the chemical in scope."
      - "Community notification and off-site emergency communication protocol."
    required_field_verification:
      - "Perimeter gas detector calibration status and windsock visibility."
    specialist_role: "Process Safety Engineer / Area HSE Lead / Emergency Response Coordinator"
    escalation_level: "LEVEL_3_CRITICAL_CONCERN"

  - pattern_id: "ENV-EM-05"
    name: "Spill Response Equipment Availability & Compatibility"
    hazard_mechanism: "Delayed or ineffective spill containment allows chemical to seep into permeable ground, contaminate groundwater, or spread uncontrollably."
    common_flawed_safeguard: "'Spill kit available in area' or 'Absorbent pads will be used.'"
    challenge_questions:
      - "Is the spill response kit specifically compatible with the chemical in scope (e.g., neutralizing absorbent for strong acids/bases, hydrophobic for oils, chemical-resistant boom)?"
      - "Is the quantity of absorbent and neutralizing agent sufficient for the maximum credible task-level release volume?"
      - "Are responders trained and equipped with correct chemical-resistant PPE (boots, suits, respirators) before deploying spill kits?"
      - "What is the secondary recovery and hazardous waste disposal route for used absorbents and contaminated soil?"
    prohibited_ai_assumptions:
      - "Assuming a generic yellow spill kit is suitable for all chemical types."
      - "Assuming small absorbent pads can mitigate a pressurized or bulk transfer leak."
    required_evidence:
      - "Spill kit inspection tag and chemical compatibility datasheet."
      - "Hazardous waste disposal contract / protocol for contaminated cleanup material."
    required_field_verification:
      - "Physical check of spill kit contents, seal integrity, and accessibility at the work site."
    specialist_role: "Area HSE / Waste Management Specialist"
    escalation_level: "LEVEL_1_REVIEW"
