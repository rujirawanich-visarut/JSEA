schema_version: "1.0.0"
schema_id: "unified-evidence-label-schema"
status: "operational"
description: >-
  Single canonical set of evidence labels and escalation levels shared across
  Package 1B (jsea-hazard-blind-spot-mapper) and Package 2B
  (jsea-safeguard-challenge-assistant). Using this unified schema prevents
  inconsistent outputs and enables cross-package traceability.
authority_basis:
  - "OSHA 29 CFR 1910.119 (Process Safety Management)"
  - "CCPS Risk-Based Process Safety — Evidence discipline principles"
  - "UK HSE HSG250 (Permit-to-Work); HSG253 (Safe Isolation)"
created_date: "2026-08-15"
update_owner: "Process Safety Engineer / SSHE Lead"
review_frequency: "Annual or after any incident that reveals labeling error"
applies_to:
  - "jsea-hazard-blind-spot-mapper v1.0.0+"
  - "jsea-safeguard-challenge-assistant v1.0.0+"

# ─────────────────────────────────────────────────────────────────────────────
# SECTION 1: EVIDENCE LABELS
# Use exactly these labels when tagging any claim, scenario, or data item.
# ─────────────────────────────────────────────────────────────────────────────
evidence_labels:
  - id: "FACT"
    definition: >-
      Information that has been explicitly supplied by the user or retrieved from
      a named, traceable, and current document (SDS, P&ID, PTW, inspection record,
      field measurement). The AI has not generated or inferred this datum.
    usage_rule: >-
      Only assign FACT when the source is named and the information is verifiable
      by reference to that source. If the source is not current, assign FACT with
      a staleness warning.
    example: "SDS Section 2 states Flash Point = 28°C [FACT — SDS Rev. 12, 2025-04-01]"

  - id: "REFERENCE"
    definition: >-
      Content that derives from an approved reference document, standard, guidance,
      or regulation (e.g., OSHA 1910.119, ISO 45001, UK HSE HSG253, CCPS RBPS,
      Thailand Hazardous Substance Act). The AI is drawing on encoded knowledge
      rather than a site-supplied document.
    usage_rule: >-
      Cite the source (title + publisher + URL if public). Never treat REFERENCE
      as equivalent to site-specific or field-verified FACT. Site procedures,
      SDS, and approved engineering standards for the specific facility prevail
      over generic REFERENCE content.
    example: "Positive physical isolation is required for IDLH-toxic service
      [REFERENCE — UK HSE HSG253:2006, Section 4]"

  - id: "AI_HYPOTHESIS"
    definition: >-
      A plausible scenario, hazard, or safeguard weakness generated by the AI
      based on pattern recognition, analogy, or reference knowledge. It has NOT
      been confirmed by site-specific documents or field verification.
    usage_rule: >-
      Every AI_HYPOTHESIS must be accompanied by a validation requirement
      (evidence request + competent role). AI_HYPOTHESIS must never be used
      to justify a hazard as absent, a safeguard as adequate, or work as safe.
    example: "Pyrophoric iron sulfide may be present given H₂S service history
      [AI_HYPOTHESIS — requires decontamination confirmation by Process Engineer]"

  - id: "EVIDENCE_GAP"
    definition: >-
      Information that is required to assess a hazard or safeguard but is absent,
      unconfirmed, conflicting, or outdated. Evidence gaps must be explicitly
      flagged with a criticality level.
    criticality_levels:
      CRITICAL:
        definition: >-
          Absence of this information prevents safe task analysis or reveals a
          potential uncontrolled fatal or catastrophic hazard. Analysis of the
          affected scope must halt until resolved.
        action: "STOP_AND_ESCALATE to named competent authority"
      MATERIAL:
        definition: >-
          Absence significantly reduces confidence in the analysis. The affected
          scenario may be assessed as AI_HYPOTHESIS only, with an explicit
          evidence request.
        action: "Proceed as AI_HYPOTHESIS with mandatory evidence request"
      NON_CRITICAL:
        definition: >-
          Absence is acknowledged but does not prevent a reasonable preliminary
          assessment. Disclose the limitation.
        action: "Disclose limitation; complete analysis with caveat"
    usage_rule: >-
      Always state what information is missing and who must supply it.
    example: "Current operating pressure not provided. Cannot confirm zero-energy
      state [EVIDENCE_GAP — CRITICAL — requires field pressure gauge reading
      by Isolation Authority]"

  - id: "HUMAN_ONLY_DECISION"
    definition: >-
      A decision that is explicitly reserved for authorized human personnel and
      must never be issued, estimated, or implied by the AI. These decisions
      include but are not limited to: work approval, permit issuance, residual
      risk acceptance, safe-to-proceed declaration, and final risk rating.
    usage_rule: >-
      When a request or question falls under this label, the AI must decline to
      answer the decision and direct the user to the appropriate authorized role.
      The AI must not soften this boundary under any framing of the request.
    example: "Whether this job is safe to proceed is a HUMAN_ONLY_DECISION
      reserved for the Permit Issuing Authority and Area Owner per site PTW
      procedure."

# ─────────────────────────────────────────────────────────────────────────────
# SECTION 2: UNIFIED ESCALATION LEVELS
# Use exactly these levels across both packages. Maps P1B and P2B nomenclature.
# ─────────────────────────────────────────────────────────────────────────────
escalation_levels:
  - id: "WATCH"
    p1b_equivalent: "WATCH"
    p2b_equivalent: "LEVEL_1_REVIEW"
    definition: >-
      A weak signal or emerging condition that warrants monitoring or routine
      clarification. Does not block analysis continuation.
    action: "Document; request clarification at next opportunity"

  - id: "STANDARD_REVIEW"
    p1b_equivalent: "STANDARD_REVIEW"
    p2b_equivalent: "LEVEL_1_REVIEW"
    definition: >-
      Material concern that is normally manageable through approved site controls
      and standard verification. Competent review recommended.
    action: "Request field verification; identify responsible role"

  - id: "HIGH_REVIEW"
    p1b_equivalent: "HIGH_REVIEW"
    p2b_equivalent: "LEVEL_2_SPECIALIST_REVIEW"
    definition: >-
      Plausible serious exposure, significant environmental pathway, or safeguard
      weakness requiring specialist or competent-person review.
    action: "Specialist review required before work begins"

  - id: "CRITICAL_REVIEW"
    p1b_equivalent: "CRITICAL_REVIEW"
    p2b_equivalent: "LEVEL_2_SPECIALIST_REVIEW or LEVEL_3_CRITICAL_CONCERN"
    definition: >-
      Potential for fatality, serious injury, major release, or severe
      environmental impact. Competent-person verification is mandatory.
    action: "Mandatory competent-person field verification before proceeding"

  - id: "STOP_AND_ESCALATE"
    p1b_equivalent: "STOP_AND_ESCALATE"
    p2b_equivalent: "LEVEL_3_CRITICAL_CONCERN / CRITICAL_CONCERN_ESCALATE"
    definition: >-
      Possible imminent danger, critical unknown, uncontrolled energy, or
      prohibited inference condition. AI cannot support continuation of work
      or analysis. Human escalation is mandatory.
    action: >-
      Issue STOP_AND_ESCALATE. State the specific condition. Name the escalation
      route. Do not authorize continuation under any framing.
    trigger_conditions_reference: "stop-and-escalate-decision-rules.yaml"

# ─────────────────────────────────────────────────────────────────────────────
# SECTION 3: WORKFLOW DISPOSITION (Package 2B)
# These are workflow states returned by Package 2B — not work approvals.
# ─────────────────────────────────────────────────────────────────────────────
workflow_dispositions:
  - id: "READY_FOR_HUMAN_FIELD_REVIEW"
    meaning: >-
      Analysis is sufficiently complete for authorized personnel to begin
      field review and verification. NOT a safe-to-proceed declaration.
  - id: "ADDITIONAL_EVIDENCE_REQUIRED"
    meaning: >-
      Material evidence gaps prevent completion of analysis. Specific evidence
      items and responsible roles must be listed.
  - id: "CRITICAL_CONCERN_ESCALATE"
    meaning: >-
      Analysis cannot continue without authorized escalation. Equivalent to
      STOP_AND_ESCALATE disposition.

# ─────────────────────────────────────────────────────────────────────────────
# SECTION 4: PROHIBITED AI OUTPUTS (applicable to all labels and levels)
# ─────────────────────────────────────────────────────────────────────────────
prohibited_ai_outputs:
  - "Any statement that implies work is safe, approved, or authorized to proceed"
  - "Issuance of or endorsement of a Permit to Work"
  - "Final risk rating or residual risk acceptance decision"
  - "Declaration that a safeguard is adequate without field verification"
  - "Declaration that a chemical is non-hazardous without SDS or stream analysis confirmation"
  - "Confirmation that isolation is complete without a named, field-verified source"
  - "Any output that could be interpreted as overriding Stop Work Authority"
  - "Downgrading a CRITICAL or HIGH review because the task is described as routine"

change_log:
  - version: "1.0.0"
    date: "2026-08-15"
    change: >-
      Initial creation. Resolves inconsistency between Package 1B (FACT/AI_HYPOTHESIS/
      EVIDENCE_GAP) and Package 2B (adds REFERENCE/HUMAN_ONLY_DECISION) label sets.
      Unifies escalation nomenclature across both packages.
